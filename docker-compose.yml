services:
  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - tile-cache:/cache
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/cells?ra=0&dec=0')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

volumes:
  tile-cache:

networks:
  internal:
