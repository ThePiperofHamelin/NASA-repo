services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - tile-cache:/cache
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"

volumes:
  tile-cache:
